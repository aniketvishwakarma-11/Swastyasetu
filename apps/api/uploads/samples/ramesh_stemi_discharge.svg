  <line x1="40" y1="722" x2="760" y2="722" stroke="#CBD5E1" stroke-width="1" />

  <text x="56" y="746" fill="#1E293B" font-size="12" font-weight="600">• Diet: Strict low salt (&lt;2g/day), low saturated fat diet. Abundant water and fresh vegetables.</text>
  <text x="56" y="766" fill="#1E293B" font-size="12" font-weight="600">• Activity: Light walking allowed. No heavy weight lifting or strenuous manual farming for 6 weeks.</text>
  <text x="56" y="786" fill="#1E293B" font-size="12" font-weight="600">• Red Flags: Immediate referral to District Hospital CCU if sudden chest heaviness, breathlessness, or syncope.</text>
  <text x="56" y="806" fill="#0F766E" font-size="12" font-weight="700">• Follow-Up Visit: District Hospital Cardiology OPD on 06-October-2026 (Room 14, Dr. Arvind Sharma).</text>

