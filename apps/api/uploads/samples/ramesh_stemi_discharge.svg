  <text x="56" y="525" fill="#0F766E" font-size="13" font-weight="700">3. Tab. ATORVASTATIN 40 mg (High Intensity Statin)</text>
  <text x="56" y="542" fill="#334155" font-size="12">Dosage: 1 Tablet HS (At Bedtime) • Long Term Plaque Stabilization</text>
