  <text x="56" y="649" fill="#0F172A" font-size="13" font-weight="700">5. Tab. PANTOPRAZOLE 40 mg (PPI Gastroprotection)</text>
  <text x="56" y="666" fill="#334155" font-size="12">Dosage: 1 Tablet OD • 30 Minutes Before Breakfast on empty stomach • Duration: 30 Days</text>
  <text x="680" y="657" fill="#059669" font-size="11" font-weight="700">High Clarity</text>

  <!-- Step-Down Advice & Instructions -->
