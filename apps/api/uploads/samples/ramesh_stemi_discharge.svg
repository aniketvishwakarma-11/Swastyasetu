  <rect x="40" y="564" width="720" height="52" rx="4" fill="#F0FDFA" stroke="#CCFBF1" stroke-width="1" />
  <text x="56" y="587" fill="#0F766E" font-size="13" font-weight="700">4. Tab. METOPROLOL SUCCINATE ER 25 mg (Beta Blocker)</text>
  <text x="56" y="604" fill="#334155" font-size="12">Dosage: 1/2 Tablet BD (12.5 mg Twice Daily) • Check Heart Rate prior to dose (Hold if HR &lt; 55 bpm)</text>
  <text x="680" y="595" fill="#059669" font-size="11" font-weight="700">High Clarity</text>

