  <text x="40" y="340" fill="#0F766E" font-size="14" font-weight="700" letter-spacing="0.5">DISCHARGE MEDICATIONS (Rx)</text>
  <line x1="40" y1="348" x2="760" y2="348" stroke="#0D9488" stroke-width="2" />

  <!-- Medication 1: Ecosprin -->
  <rect x="40" y="365" width="720" height="52" rx="4" fill="#F0FDFA" stroke="#CCFBF1" stroke-width="1" />
  <text x="56" y="388" fill="#0F766E" font-size="13" font-weight="700">1. Tab. ECOSPRIN 75 mg (Aspirin)</text>
  <text x="56" y="405" fill="#334155" font-size="12">Dosage: 1 Tablet OD (Once Daily) • After Breakfast • Duration: 1 Year (Lifelong Cardioprotection)</text>
  <text x="680" y="396" fill="#059669" font-size="11" font-weight="700">High Clarity</text>

