<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="crossGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdfa" />
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#022c22" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <!-- Subtle Inset Rim -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#2dd4bf" stroke-width="1.2" stroke-opacity="0.35" />

  <!-- Setu (Bridge) Horizon Curve -->
  <path d="M 12 53 Q 32 43 52 53" stroke="#2dd4bf" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.55" />
  <path d="M 18 57 Q 32 49 46 57" stroke="#99f6e4" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.3" />

  <!-- Single Continuous Unified Medical Cross (No overlapping notched corners) -->
  <path d="
    M 26 15 
    A 3 3 0 0 1 29 12 
    H 35 
    A 3 3 0 0 1 38 15 
    V 24 
    H 47 
    A 3 3 0 0 1 50 27 
    V 33 
    A 3 3 0 0 1 47 36 
    H 38 
    V 45 
    A 3 3 0 0 1 35 48 
    H 29 
    A 3 3 0 0 1 26 45 
    V 36 
    H 17 
    A 3 3 0 0 1 14 33 
    V 27 
    A 3 3 0 0 1 17 24 
    H 26 
    Z" 
    fill="url(#crossGlow)" 
    filter="url(#badgeShadow)" 
  />

  <!-- Dynamic Centered Vital Heartbeat Wave (Strictly contained within cross boundaries) -->
  <path d="M 14 30 H 23 L 27 20 L 32 40 L 36 24 L 39 30 H 50" 
    stroke="#0d9488" 
    stroke-width="2.8" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
    fill="none" 
  />
</svg>
