<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Deep Cinematic Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="45%" stop-color="#041f1e" />
      <stop offset="100%" stop-color="#0b1329" />
    </linearGradient>

    <!-- Brand Teal Accent Gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Closed Loop Glow Gradient -->
    <linearGradient id="closedLoopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Subtle Atmospheric Neon Orbs -->
  <circle cx="180" cy="140" r="140" fill="#0d9488" opacity="0.22" filter="url(#glow)" />
  <circle cx="1020" cy="300" r="160" fill="#10b981" opacity="0.18" filter="url(#glow)" />
  <circle cx="600" cy="580" r="120" fill="#0284c7" opacity="0.15" filter="url(#glow)" />

  <!-- Modern Geometric Architectural Grid Overlay -->
  <g stroke="#334155" stroke-width="1" opacity="0.25">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="0" y1="380" x2="1200" y2="380" />
    <line x1="0" y1="550" x2="1200" y2="550" />
    <line x1="80" y1="0" x2="80" y2="630" />
    <line x1="360" y1="0" x2="360" y2="630" />
    <line x1="640" y1="0" x2="640" y2="630" />
    <line x1="920" y1="0" x2="920" y2="630" />
    <line x1="1120" y1="0" x2="1120" y2="630" />
  </g>

  <!-- ==================== HEADER BRAND SECTION ==================== -->
  <g transform="translate(80, 55)">
    <!-- SwasthyaSetu Icon Badge (100x100) -->
    <g filter="url(#cardShadow)">
      <rect width="100" height="100" rx="26" fill="url(#tealGrad)" />
      <rect x="1" y="1" width="98" height="98" rx="25" fill="none" stroke="#5eead4" stroke-width="1.5" stroke-opacity="0.4" />
      
      <!-- Bridge Curve in Badge -->
      <path d="M 20 82 Q 50 67 80 82" stroke="#5eead4" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6" />

      <!-- Seamless Medical Cross -->
      <path d="
        M 41 24 
        A 4 4 0 0 1 45 20 
        H 55 
        A 4 4 0 0 1 59 24 
        V 38 
        H 73 
        A 4 4 0 0 1 77 42 
        V 52 
        A 4 4 0 0 1 73 56 
        H 59 
        V 70 
        A 4 4 0 0 1 55 74 
        H 45 
        A 4 4 0 0 1 41 70 
        V 56 
        H 27 
        A 4 4 0 0 1 23 52 
        V 42 
        A 4 4 0 0 1 27 38 
        H 41 
        Z" 
        fill="#ffffff" 
      />

      <!-- Dynamic Vital Pulse Inside Badge Cross -->
      <path d="M 23 47 H 36 L 42 32 L 50 62 L 57 38 L 62 47 H 77" 
        stroke="#0d9488" 
        stroke-width="4" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" 
      />
    </g>

    <!-- Header Text Area -->
    <g transform="translate(125, 0)">
      <!-- Government / Department Eyebrow -->
      <g transform="translate(0, 14)">
        <rect width="360" height="24" rx="6" fill="#134e4a" stroke="#2dd4bf" stroke-width="1" stroke-opacity="0.4" />
        <text x="12" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#5eead4" letter-spacing="1.2">
          HEALTHCARE CONTINUITY LAYER • PUNE PILOT
        </text>
      </g>

      <!-- Main Title & Offline Badge Row -->
      <text x="0" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
        SwasthyaSetu
      </text>

      <g transform="translate(345, 37)">
        <rect width="135" height="30" rx="8" fill="#047857" stroke="#34d399" stroke-width="1" />
        <circle cx="16" cy="15" r="4" fill="#6ee7b7" />
        <text x="28" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ecfdf5" letter-spacing="0.5">
          OFFLINE-FIRST
        </text>
      </g>

      <!-- Subtitle -->
      <text x="0" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#94a3b8">
        Healthcare continuity that survives weak connectivity across rural PHCs and District Hospitals.
      </text>
    </g>
  </g>

  <!-- ==================== CORE ARCHITECTURE PIPELINE ==================== -->
  <g transform="translate(80, 215)">
    <!-- Container Panel -->
    <rect width="1040" height="135" rx="20" fill="#0b1528" stroke="#1e293b" stroke-width="1.5" filter="url(#cardShadow)" />

    <!-- Pipeline Title Bar -->
    <text x="30" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#64748b" letter-spacing="1.5">
      INTER-FACILITY CARE CONTINUITY FORMULA
    </text>

    <!-- Step 1: Referral Card (x=30, w=160) -->
    <g transform="translate(30, 48)">
      <rect width="160" height="66" rx="12" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" />
      <text x="80" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#38bdf8" letter-spacing="0.5">
        REFERRAL
      </text>
      <text x="80" y="48" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">
        Offline PHC Intake
      </text>
    </g>

    <!-- Operator + -->
    <text x="210" y="88" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#64748b">+</text>

    <!-- Step 2: Identity Card (x=230, w=160) -->
    <g transform="translate(230, 48)">
      <rect width="160" height="66" rx="12" fill="#0f172a" stroke="#9333ea" stroke-width="1.5" />
      <text x="80" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#c084fc" letter-spacing="0.5">
        IDENTITY
      </text>
      <text x="80" y="48" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">
        Fuzzy Match &amp; ABHA
      </text>
    </g>

    <!-- Operator + -->
    <text x="410" y="88" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#64748b">+</text>

    <!-- Step 3: Document Card (x=430, w=160) -->
    <g transform="translate(430, 48)">
      <rect width="160" height="66" rx="12" fill="#0f172a" stroke="#d97706" stroke-width="1.5" />
      <text x="80" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#fbbf24" letter-spacing="0.5">
        DOCUMENT
      </text>
      <text x="80" y="48" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">
        AI Vision &amp; OCR
      </text>
    </g>

    <!-- Operator + -->
    <text x="610" y="88" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#64748b">+</text>

    <!-- Step 4: Follow-Up Card (x=630, w=160) -->
    <g transform="translate(630, 48)">
      <rect width="160" height="66" rx="12" fill="#0f172a" stroke="#059669" stroke-width="1.5" />
      <text x="80" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#34d399" letter-spacing="0.5">
        FOLLOW-UP
      </text>
      <text x="80" y="48" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">
        ASHA Hand-Back
      </text>
    </g>

    <!-- Operator = -->
    <text x="810" y="88" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#2dd4bf">=</text>

    <!-- Step 5: Closed Loop Result (x=830, w=180) -->
    <g transform="translate(830, 48)">
      <rect width="180" height="66" rx="12" fill="url(#closedLoopGrad)" stroke="#2dd4bf" stroke-width="2" />
      <text x="90" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#ffffff" letter-spacing="0.8">
        CLOSED LOOP
      </text>
      <text x="90" y="48" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#99f6e4">
        Zero Lost Patients
      </text>
    </g>
  </g>

  <!-- ==================== PILLAR FEATURE CARDS ==================== -->
  <g transform="translate(80, 385)">
    <!-- Feature 1: Zero-Data Sync -->
    <g transform="translate(0, 0)">
      <rect width="242" height="120" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <rect x="18" y="16" width="34" height="34" rx="8" fill="#134e4a" />
      <path d="M 35 24 L 28 34 H 34 L 32 42 L 41 31 H 35 Z" fill="#2dd4bf" />
      <text x="62" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">
        IndexedDB Sync
      </text>
      <text x="62" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#2dd4bf">
        Offline-First Dexie.js
      </text>
      <text x="18" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">
        Guarantees referral intake survives total rural network dropouts with 2G fallback.
      </text>
    </g>

    <!-- Feature 2: Biometric Triage -->
    <g transform="translate(266, 0)">
      <rect width="242" height="120" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <rect x="18" y="16" width="34" height="34" rx="8" fill="#3b0764" />
      <path d="M 35 23 A 5 5 0 0 1 40 28 V 38 A 5 5 0 0 1 35 43 A 5 5 0 0 1 30 38 V 28 A 5 5 0 0 1 35 23 Z" stroke="#c084fc" stroke-width="2" fill="none" />
      <path d="M 35 27 V 39" stroke="#c084fc" stroke-width="2" stroke-linecap="round" />
      <text x="62" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">
        Identity Matching
      </text>
      <text x="62" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#c084fc">
        Fuzzy Levenshtein &amp; ABHA
      </text>
      <text x="18" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">
        Prevents duplicate registrations and links past EHRs across varying name spellings.
      </text>
    </g>

    <!-- Feature 3: AI Document Vision -->
    <g transform="translate(532, 0)">
      <rect width="242" height="120" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <rect x="18" y="16" width="34" height="34" rx="8" fill="#451a03" />
      <rect x="27" y="23" width="16" height="20" rx="2" stroke="#f59e0b" stroke-width="2" fill="none" />
      <line x1="31" y1="28" x2="39" y2="28" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" />
      <line x1="31" y1="33" x2="39" y2="33" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" />
      <text x="62" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">
        AI Vision OCR
      </text>
      <text x="62" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#fbbf24">
        Rule 1 Verified Extraction
      </text>
      <text x="18" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">
        Converts handwritten slips into structured clinical summaries with doctor sign-off.
      </text>
    </g>

    <!-- Feature 4: Immutable Audit Trail -->
    <g transform="translate(798, 0)">
      <rect width="242" height="120" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <rect x="18" y="16" width="34" height="34" rx="8" fill="#064e3b" />
      <path d="M 35 23 L 43 27 V 34 C 43 39 39 43 35 44 C 31 43 27 39 27 34 V 27 Z" stroke="#34d399" stroke-width="2" fill="none" />
      <path d="M 32 33 L 34 35 L 38 31" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <text x="62" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">
        Cryptographic Trail
      </text>
      <text x="62" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#34d399">
        SHA-256 Tamper-Proof
      </text>
      <text x="18" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">
        Full medico-legal traceability under Rule 2 and DPDP Act 2023 compliance.
      </text>
    </g>
  </g>

  <!-- ==================== FOOTER COMPLIANCE BAR ==================== -->
  <g transform="translate(80, 545)">
    <line x1="0" y1="0" x2="1040" y2="0" stroke="#1e293b" stroke-width="1" />
    <text x="0" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748b">
      DPDP Act 2023 &amp; DISHA Compliant • Zero Third-Party Advertising • Government of Maharashtra
    </text>
    <text x="1040" y="28" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#94a3b8">
      Aundh District Hospital Network • Pune Division
    </text>
  </g>
</svg>
